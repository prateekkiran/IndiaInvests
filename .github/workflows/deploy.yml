name: Build & Deploy to Netlify

# Auto-deploys on every push to main. Uses a Netlify Personal Access Token +
# Site ID stored as repo secrets, so no Netlify<->GitHub OAuth app is needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests (PRD golden fixtures)
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Netlify (production)
        run: npx --yes netlify deploy --prod --dir=dist --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
